<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL self-test — MedPobeda</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background:#f4f8fc; color:#12253c; margin:0; padding:32px 16px; }
  .card { max-width: 620px; margin: 0 auto; background:#fff; border:1px solid #dbe6f0; border-radius:14px; padding:24px; box-shadow:0 8px 24px rgba(18,37,60,.08); }
  h1 { margin:0 0 6px; font-size:20px; }
  p.sub { margin:0 0 18px; color:#5a6b7e; font-size:13.5px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid #e6edf4; border-radius:10px; margin-bottom:8px; font-size:14px; }
  .ok { color:#0d7a3f; font-weight:600; }
  .bad { color:#c0392b; font-weight:600; }
  small { color:#7a8aa0; }
  #verdict { margin-top:16px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.5; }
  .v-ok { background:#e8f7ee; border:1px solid #bfe6cf; }
  .v-bad { background:#fdeeec; border:1px solid #f2c6c0; }
  canvas { width:120px; height:80px; display:block; margin:14px auto 0; border-radius:8px; border:1px solid #dbe6f0; }
</style>
</head>
<body>
<div class="card">
  <h1>WebGL self-test</h1>
  <p class="sub">Standalone test — no app code, no libraries. If this passes but the anatomy page still shows an error, the problem is in app code; if this fails, the browser/environment cannot do WebGL.</p>
  <div id="rows"></div>
  <canvas id="gl" width="120" height="80"></canvas>
  <div id="verdict">Testing…</div>
</div>
<script>
(function () {
  var rows = document.getElementById('rows');
  function row(name, ok, detail) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span>' + name + '</span><span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'PASS' : 'FAIL') + '</span>';
    rows.appendChild(d);
    if (detail) {
      var s = document.createElement('div');
      s.className = 'row';
      s.style.fontSize = '12px';
      s.innerHTML = '<span style="color:#7a8aa0">' + detail + '</span>';
      rows.appendChild(s);
    }
  }
  var results = {};
  ['webgl2', 'webgl', 'experimental-webgl'].forEach(function (kind) {
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext(kind, { failIfMajorPerformanceCaveat: false });
      results[kind] = !!gl;
      var gpu = 'n/a';
      if (gl) {
        try {
          var ext = gl.getExtension('WEBGL_debug_renderer_info');
          gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        } catch (e) { gpu = 'hidden'; }
        var lose = gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      }
      row(kind, results[kind], results[kind] ? 'GPU: ' + gpu : null);
    } catch (e) {
      results[kind] = false;
      row(kind, false, 'threw: ' + e.message);
    }
  });
  var verdict = document.getElementById('verdict');
  var canvas = document.getElementById('gl');
  var ok2 = results.webgl2;
  if (ok2) {
    try {
      var gl = canvas.getContext('webgl2');
      gl.clearColor(0.1, 0.42, 0.8, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      row('visible render test', true, 'solid blue fill drawn via webgl2');
    } catch (e) { row('visible render test', false, e.message); }
    verdict.className = 'v-ok';
    verdict.innerHTML = '<b>WebGL works in this browser.</b> If the Anatomy 3D page still shows an error after a hard refresh (Cmd+Shift+R), the cause is app code — tell the developer exactly what the page’s “Technical details” section says.';
  } else {
    verdict.className = 'v-bad';
    verdict.innerHTML = '<b>This browser/environment cannot create a WebGL context.</b> Enable hardware acceleration, update the browser, or open the site in another browser. On this device the Anatomy 3D page cannot render — that part of the error is accurate.';
  }
})();
</script>
</body>
</html>
